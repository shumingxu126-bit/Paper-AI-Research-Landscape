services:
  - type: web
    name: research-landscape-api
    runtime: python
    rootDir: .
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn app.main:app --app-dir backend --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: LLM_PROVIDER
        value: minimax
      - key: MINIMAX_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: OPENALEX_EMAIL
        sync: false
      - key: CORS_ORIGINS
        value: "*"
